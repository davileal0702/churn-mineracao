<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mineração de Dados: Churn</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Roda o app.py no navegador (stlite/Pyodide), para hospedar no GitHub Pages sem servidor -->
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
      mount(
        {
          requirements: ["pandas", "numpy", "scikit-learn", "plotly", "mlxtend"],
          entrypoint: "app.py",
          files: {
            "app.py": { url: "./app.py" },
            "data/telco_churn.csv": { url: "./data/telco_churn.csv" },
          },
          streamlitConfig: { "theme.primaryColor": "#2E86AB" },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
